<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Draft Co-Pilot Sync</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-dim: #8b949e;
      --green: #3fb950;
      --green-bg: rgba(63, 185, 80, 0.15);
      --red: #f85149;
      --red-bg: rgba(248, 81, 73, 0.15);
      --blue: #58a6ff;
      --blue-bg: rgba(88, 166, 255, 0.15);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #fff;
    }
    .version {
      font-size: 10px;
      color: var(--text-dim);
      font-family: monospace;
    }
    .status-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 12px;
    }
    .status-pill.connected {
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid rgba(63, 185, 80, 0.4);
    }
    .status-pill.disconnected {
      background: var(--red-bg);
      color: var(--red);
      border: 1px solid rgba(248, 81, 73, 0.4);
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-pill.connected .dot {
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
    }
    .status-pill.disconnected .dot {
      background: var(--red);
    }
    .status-meta {
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-family: monospace;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .input-row {
      display: flex;
      gap: 6px;
    }
    input[type="text"] {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--border);
      color: #fff;
      font-family: monospace;
      font-size: 11px;
      padding: 6px 8px;
      border-radius: 4px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: var(--blue);
    }
    button {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    button:hover {
      border-color: var(--blue);
      color: #fff;
    }
    .btn-primary {
      background: var(--blue-bg);
      border-color: var(--blue);
      color: var(--blue);
    }
    .btn-primary:hover {
      background: var(--blue);
      color: #0d1117;
    }
    .feedback {
      font-size: 10px;
      margin-top: 4px;
      min-height: 14px;
      transition: opacity 0.2s;
    }
    .feedback.success { color: var(--green); }
    .feedback.error { color: var(--red); }
    .info-footer {
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed var(--border);
      border-radius: 4px;
      padding: 8px 10px;
      font-size: 10px;
      color: var(--text-dim);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🏒 Draft Co-Pilot Sync</h1>
    <span class="version">v1.1</span>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span style="color:var(--text-dim);">Server Status</span>
      <div id="status-pill" class="status-pill disconnected">
        <span class="dot"></span>
        <span id="status-text">Checking...</span>
      </div>
    </div>
    <div class="status-meta">
      <span id="stat-latency">-</span>
      <span id="stat-last-checked">-</span>
    </div>
  </div>

  <div class="form-group">
    <div class="section-title">Co-Pilot Server URL</div>
    <div class="input-row">
      <input type="text" id="input-sync-url" placeholder="http://localhost:3333" spellcheck="false">
      <button id="btn-save" class="btn-primary" title="Save URL">Save</button>
      <button id="btn-ping" title="Test Connection">Ping</button>
    </div>
    <div id="feedback-msg" class="feedback"></div>
  </div>

  <div class="info-footer">
    <div>● <b>Auto-Sync:</b> Monitors Yahoo Draft room DOM.</div>
    <div>● <b>Live Push:</b> Sends picks hands-free to <code>/api/pick</code>.</div>
    <div>● <b>Badge:</b> Live status indicator pinned in top-right of draft room.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
